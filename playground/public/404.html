<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#fcfaf6" />
    <meta name="color-scheme" content="light" />
    <title>Page not found — Filly, the CARE mascot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 32px 24px; color: #274d35; background: #fcfaf6; font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: min(100%, 500px); margin: auto; padding: 40px 0; text-align: center; }
      img { display: block; margin: 0 auto 28px; }
      .eyebrow { margin: 0 0 14px; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: #60735c; }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); font-weight: 500; line-height: 1.15; letter-spacing: -.04em; }
      .message { max-width: 34ch; margin: 18px auto 26px; font-size: 15px; line-height: 1.7; color: #60735c; }
      a { color: #358349; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #358349; outline-offset: 5px; }
      .home-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 24px; border-radius: 999px; background: #358349; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
      .home-link:hover { background: #2b703e; }
      footer { padding-top: 24px; text-align: center; font-size: 12px; line-height: 1.8; color: #60735c; }
      footer p { margin: 0 0 8px; }
      footer a { display: inline-block; padding: 8px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="Filly, the CARE mascot" width="104" height="104" />
      <p class="eyebrow">404 · A LITTLE DETOUR</p>
      <h1>Let’s find our way back.</h1>
      <p class="message">Filly couldn’t find this page. The character studio is right this way.</p>
      <a class="home-link" href="/">Back to Filly</a>
    </main>
    <footer>
      <p>The CARE mascot from Open Healthcare Network.</p>
      <a href="https://github.com/ohcnetwork/care_filly_character">View on GitHub</a>
    </footer>
  </body>
</html>
